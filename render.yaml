services:
  - type: web
    name: matrimony-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: matrimony-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: info

databases:
  - name: matrimony-db
    plan: free
    region: oregon
    databaseName: matrimony
    user: postgres
