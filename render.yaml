services:
  - type: web
    name: matrimony-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: matrimony-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: info
      - key: STORAGE_DRIVER
        value: r2
      - key: R2_REGION
        value: auto
      - key: R2_KEY_PREFIX
        value: uploads/
      - key: R2_MAX_UPLOAD_MB
        value: "5"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false

databases:
  - name: matrimony-db
    plan: free
    region: oregon
    databaseName: matrimony
